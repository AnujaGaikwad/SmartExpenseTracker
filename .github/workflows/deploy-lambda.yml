name: Debug GitHub OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setOutput('token', token);

      - name: Decode OIDC token claims
        env:
          TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("sub =", claims.get("sub"))
          print("aud =", claims.get("aud"))
          print("repository =", claims.get("repository"))
          print("repository_owner =", claims.get("repository_owner"))
          print("ref =", claims.get("ref"))
          print("workflow_ref =", claims.get("workflow_ref"))
          PY
